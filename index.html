<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Para mi Danilimda ♥</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0b0b0f;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Cascadia Code", "Fira Code", "JetBrains Mono", Consolas, "Courier New", monospace;
    }
    #screen {
      margin: 0;
      line-height: 1.05;
      letter-spacing: 0px;
      white-space: pre;
      user-select: none;
      text-align: center;
    }
    #music-btn {
      position: fixed;
      bottom: 18px;
      right: 18px;
      z-index: 20;
      background: rgba(255, 105, 180, 0.16);
      color: #ffb6d9;
      border: 1px solid rgba(255, 135, 195, 0.45);
      border-radius: 999px;
      padding: 9px 16px;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: all 0.25s ease;
    }
    #music-btn:hover {
      background: rgba(255, 105, 180, 0.3);
      transform: scale(1.04);
    }
    #yt-player {
      position: fixed;
      top: -100px;
      left: -100px;
      width: 10px;
      height: 10px;
      opacity: 0.01;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <pre id="screen"></pre>
  <button id="music-btn" type="button">🎵 Activar música</button>
  <div id="yt-player"></div>

  <script>
    const YOUTUBE_VIDEO_ID = "CTedtTud2EM";

    const SPIN_SPEED = 0.55;
    const TILT = 0.32;
    const CAM_DIST = 4.6;
    const MESSAGE = "Para mi Danilimda ♥";
    const NUM_HEARTS = 22;
    const PIVOT_Y = 0.25;

    function ansiToHex(code) {
      if (code >= 232) {
        const v = 8 + (code - 232) * 10;
        const h = v.toString(16).padStart(2, "0");
        return `#${h}${h}${h}`;
      }
      const c = code - 16;
      const levels = [0, 95, 135, 175, 215, 255];
      const r = levels[Math.floor(c / 36)];
      const g = levels[Math.floor((c % 36) / 6)];
      const b = levels[c % 6];
      return `#${r.toString(16).padStart(2, "0")}${g.toString(16).padStart(2, "0")}${b.toString(16).padStart(2, "0")}`;
    }

    const mapPal = (arr) => arr.map(ansiToHex);

    const WHITE = mapPal([244, 248, 251, 254, 255, 231]);
    const PINK = mapPal([125, 162, 168, 205, 211, 218, 225]);
    const DEEP_PINK = mapPal([89, 125, 161, 197, 204, 211, 218]);
    const RED = mapPal([52, 88, 124, 160, 196, 203, 210]);
    const PURPLE = mapPal([54, 91, 97, 134, 140, 183, 219]);
    const YELLOW = mapPal([136, 178, 214, 220, 226, 229]);
    const GOLD_CENTER = mapPal([58, 94, 136, 178, 214, 220]);
    const GREENS = mapPal([22, 28, 28, 34, 35, 71, 77, 114]);
    const PAPER = mapPal([101, 144, 187, 223, 230, 231]);
    const RIBBON = mapPal([88, 125, 161, 197, 204, 211]);
    const HEART_COLORS = mapPal([161, 197, 204, 205, 211, 218]);
    const MSG_COLORS = mapPal([161, 168, 205, 211, 218, 225, 218, 211, 205, 168]);

    const SHADE = ".:-=+*%@";
    const PETAL_SHADE = ".,-~:;+*#%@";

    const _L = [-0.45, 0.6, 0.66];
    const _n = Math.hypot(..._L);
    const [LX, LY, LZ] = _L.map((v) => v / _n);

    const DISC_TYPES = [
      [WHITE, GOLD_CENTER, 12],
      [PINK, GOLD_CENTER, 10],
    ];
    const ROSE_COLORS = [RED, DEEP_PINK, PINK, RED, DEEP_PINK, PURPLE, PINK];
    const TULIP_COLORS = [PINK, YELLOW];

    function mulberry32(seed) {
      return function () {
        let t = (seed += 0x6d2b79f5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function norm(v) {
      const m = Math.hypot(v[0], v[1], v[2]) || 1.0;
      return [v[0] / m, v[1] / m, v[2] / m];
    }

    function cross(a, b) {
      return [
        a[1] * b[2] - a[2] * b[1],
        a[2] * b[0] - a[0] * b[2],
        a[0] * b[1] - a[1] * b[0],
      ];
    }

    function add(p, d, k) {
      return [p[0] + d[0] * k, p[1] + d[1] * k, p[2] + d[2] * k];
    }

    function buildScene() {
      const rand = mulberry32(21);
      const uniform = (a, b) => a + (b - a) * rand();
      const pts = [];
      const neck = [0.0, -0.14, 0.0];

      const C = [0.0, 0.12, 0.0];
      const D = 1.08;
      const N = 11;
      const golden = Math.PI * (3 - Math.sqrt(5));
      const heads = [];

      for (let i = 0; i < N; i++) {
        const el = ((84 - 70 * Math.sqrt(i / (N - 1))) * Math.PI) / 180;
        const az = i * golden;
        const d = [Math.cos(el) * Math.cos(az), Math.sin(el), Math.cos(el) * Math.sin(az)];
        const pos = add(C, d, D * uniform(0.97, 1.06));
        heads.push([pos, norm(d)]);
      }

      const tulipSlots = new Set([6, 10]);
      const discSlots = new Set([4, 8]);
      const flowers = [];
      let discI = 0, roseI = 0, tulipI = 0;

      heads.forEach(([pos, axis], idx) => {
        const base = add(pos, axis, -0.05);
        for (let j = 0; j < 95; j++) {
          const t = j / 94;
          pts.push([
            base[0] + (neck[0] - base[0]) * t,
            base[1] + (neck[1] - base[1]) * t,
            base[2] + (neck[2] - base[2]) * t,
            axis[0], 0.0, axis[2],
            GREENS, -0.15, true, null,
          ]);
        }

        if (tulipSlots.has(idx)) {
          flowers.push([pos, "tulip", TULIP_COLORS[tulipI % TULIP_COLORS.length], null, 0, 0.22, uniform(0, 6.28)]);
          tulipI++;
        } else if (discSlots.has(idx)) {
          const [petals, center, nPet] = DISC_TYPES[discI % DISC_TYPES.length];
          discI++;
          flowers.push([pos, "disc", petals, center, nPet, 0.225, uniform(0, 6.28)]);
        } else {
          flowers.push([pos, "rose", ROSE_COLORS[roseI % ROSE_COLORS.length], null, 5, uniform(0.24, 0.265), uniform(0, 6.28)]);
          roseI++;
        }
      });

      for (let i = 0; i < 9; i++) {
        const a = ((i + 0.4) / 9) * 2 * Math.PI;
        const c = Math.cos(a), s = Math.sin(a);
        const base = [0.38 * c, 0.36, 0.38 * s];
        const d = norm([c, 0.15, s]);
        const side = [-s, 0.0, c];
        const n = norm(cross(side, d));
        const L = 0.42, W = 0.095;

        for (let ti = 0; ti < 38; ti++) {
          const t = ti / 37;
          for (let wi = -6; wi <= 6; wi++) {
            const w = wi / 6;
            const curl = 0.03 * w * w;
            pts.push([
              base[0] + d[0] * L * t + side[0] * W * Math.sin(Math.PI * t) * w + n[0] * curl,
              base[1] + d[1] * L * t - 0.12 * t * t + n[1] * curl,
              base[2] + d[2] * L * t + side[2] * W * Math.sin(Math.PI * t) * w + n[2] * curl,
              n[0], n[1], n[2],
              GREENS, wi === 0 ? -0.25 : 0.0, true, null,
            ]);
          }
        }
      }

      const y0 = -0.24, y1 = 0.38, r0 = 0.08, r1 = 0.50;
      const k = (r1 - r0) / (y1 - y0);
      const rings = 58;
      for (let i = 0; i < rings; i++) {
        const t = i / (rings - 1);
        const r = r0 + (r1 - r0) * t;
        const count = Math.max(10, Math.floor(185 * r));
        for (let j = 0; j < count; j++) {
          const ph = ((j + rand()) / count) * 2 * Math.PI;
          const c = Math.cos(ph), s = Math.sin(ph);
          let y = y0 + (y1 - y0) * t;
          if (t > 0.9) y += 0.04 * Math.sin(9 * ph);
          const fold = 0.3 * (Math.abs(Math.sin(5 * ph)) - 0.6);
          const nn = norm([c, -k, s]);
          pts.push([r * c, y, r * s, nn[0], nn[1], nn[2], PAPER, fold, false, null]);
        }
      }

      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * 2 * Math.PI;
        const sx = 0.032 * Math.cos(a), sz = 0.032 * Math.sin(a);
        for (let j = 0; j < 45; j++) {
          const t = j / 44;
          pts.push([
            sx * (1 + 1.2 * t), -0.24 - 0.36 * t, sz * (1 + 1.2 * t),
            Math.cos(a), 0.0, Math.sin(a),
            GREENS, -0.1, true, null,
          ]);
        }
      }

      const by = -0.14;
      const br = r0 + k * (by - y0) + 0.015;
      for (let j = 0; j < 100; j++) {
        const ph = (j / 100) * 2 * Math.PI;
        for (const dy of [-0.015, 0.0, 0.015]) {
          pts.push([
            br * Math.cos(ph), by + dy, br * Math.sin(ph),
            Math.cos(ph), 0.0, Math.sin(ph),
            RIBBON, 0.0, false, null,
          ]);
        }
      }

      const knot = [0.0, by, br + 0.015];
      for (const side of [-1, 1]) {
        for (let j = 0; j < 80; j++) {
          const a = (j / 80) * 2 * Math.PI;
          const lx = side * (0.09 + 0.09 * Math.cos(a));
          const ly = 0.05 * Math.sin(a) + (0.025 * (0.09 + 0.09 * Math.cos(a))) / 0.18;
          for (const fill of [1.0, 0.7]) {
            pts.push([
              knot[0] + lx * fill, knot[1] + ly * fill, knot[2] + 0.012,
              side * 0.3, 0.2, 0.93,
              RIBBON, 0.1, true, null,
            ]);
          }
        }
        for (let j = 0; j < 35; j++) {
          const t = j / 34;
          pts.push([
            knot[0] + side * 0.08 * t, knot[1] - 0.19 * t, knot[2] + 0.018,
            side * 0.2, 0.0, 0.98,
            RIBBON, -0.05 + 0.05 * Math.sin(t * 9), true, null,
          ]);
        }
      }
      for (const dx of [-0.012, 0.0, 0.012]) {
        pts.push([dx, by, knot[2] + 0.025, 0, 0, 1, RIBBON, 0.2, true, "@"]);
      }

      const babies = [];
      for (let i = 0; i < 85; i++) {
        const a = rand() * 2 * Math.PI;
        const el = uniform(0.25, 1.4);
        const rr = uniform(0.65, 0.90);
        babies.push([
          rr * Math.cos(a) * Math.cos(el),
          C[1] + rr * Math.sin(el),
          rr * Math.sin(a) * Math.cos(el),
          uniform(0, 6.28),
        ]);
      }

      const sparkles = [];
      for (let i = 0; i < 36; i++) {
        const a = rand() * 2 * Math.PI;
        const rr = uniform(1.10, 1.38);
        sparkles.push([
          rr * Math.cos(a),
          uniform(-0.35, 1.35),
          rr * Math.sin(a),
          uniform(0, 6.28),
          uniform(1.5, 4.0),
        ]);
      }

      return { pts, flowers, babies, sparkles };
    }

    const scene = buildScene();
    const hearts = [];
    const screenEl = document.getElementById("screen");

    let cols = 100, rows = 45;
    function updateGridSize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const targetRows = w < 600 ? 44 : 52;
      const fontSize = Math.max(7, Math.floor(h / (targetRows * 1.06)));
      screenEl.style.fontSize = fontSize + "px";
      const charWidth = fontSize * 0.6;
      cols = Math.max(46, Math.floor(w / charWidth) - 1);
      rows = Math.max(28, Math.floor(h / (fontSize * 1.05)) - 1);
    }
    window.addEventListener("resize", updateGridSize);
    updateGridSize();

    function updateHearts(dt) {
      while (hearts.length < NUM_HEARTS) {
        hearts.push([
          Math.random(),
          1.0 + Math.random(),
          0.03 + Math.random() * 0.05,
          Math.random() * 6.28,
          HEART_COLORS[Math.floor(Math.random() * HEART_COLORS.length)],
        ]);
      }
      for (const h of hearts) {
        h[1] -= h[2] * dt;
        if (h[1] < 0) {
          h[0] = Math.random();
          h[1] = 1.0;
          h[4] = HEART_COLORS[Math.floor(Math.random() * HEART_COLORS.length)];
        }
      }
    }

    function render(t) {
      const { pts, flowers, babies, sparkles } = scene;
      const chars = Array.from({ length: rows }, () => new Array(cols).fill(" "));
      const colors = Array.from({ length: rows }, () => new Array(cols).fill(""));
      const zbuf = Array.from({ length: rows }, () => new Float32Array(cols).fill(-1e9));

      const viewRows = rows - 2;
      const scale = Math.max(1.0, Math.min((viewRows - 2) / 1.95, (cols - 2) / 3.65));
      const sxScale = scale * 2.0;
      const cx = cols / 2;
      const cy = 1 + 0.98 * scale;

      const ang = t * SPIN_SPEED;
      const ca = Math.cos(ang), sa = Math.sin(ang);
      const ct = Math.cos(TILT), st = Math.sin(TILT);

      function project(x, y, z) {
        const xr = x * ca - z * sa;
        const zr = x * sa + z * ca;
        const yp = y - PIVOT_Y;
        const yt = yp * ct - zr * st;
        const zt = yp * st + zr * ct;
        const f = CAM_DIST / (CAM_DIST - zt);
        return [Math.floor(cx + xr * f * sxScale), Math.floor(cy - yt * f * scale), zt];
      }

      function projectF(x, y, z) {
        const xr = x * ca - z * sa;
        const zr = x * sa + z * ca;
        const yp = y - PIVOT_Y;
        const yt = yp * ct - zr * st;
        const zt = yp * st + zr * ct;
        const f = CAM_DIST / (CAM_DIST - zt);
        return [cx + xr * f * sxScale, cy - yt * f * scale, zt, f];
      }

      function plot(col, row, z, ch, color) {
        if (row >= 0 && row < viewRows && col >= 0 && col < cols && z > zbuf[row][col]) {
          zbuf[row][col] = z;
          chars[row][col] = ch;
          colors[row][col] = color;
        }
      }

      for (const [x, y, , phase, color] of hearts) {
        const col = (((Math.floor((x + 0.015 * Math.sin(t * 1.2 + phase)) * cols)) % cols) + cols) % cols;
        plot(col, Math.floor(y * viewRows), -50, "♥", color);
      }

      for (const [x, y, z, nx, ny, nz, pal, tone, twoSided, override] of pts) {
        const [col, row, zt] = project(x, y, z);
        const nxr = nx * ca - nz * sa;
        const nzr = nx * sa + nz * ca;
        const nyt = ny * ct - nzr * st;
        const nzt = ny * st + nzr * ct;
        let dot = nxr * LX + nyt * LY + nzt * LZ;
        if (twoSided && dot < 0) dot = -dot * 0.55;
        let b = 0.25 + 0.75 * Math.max(0.0, dot) + tone;
        b = Math.min(0.999, Math.max(0.0, b));
        const ch = override || SHADE[Math.floor(b * SHADE.length)];
        plot(col, row, zt, ch, pal[Math.floor(b * pal.length)]);
      }

      for (const [[x, y, z], kind, pal, cpal, nPet, R, seed] of flowers) {
        const [fx, fy, zt, f] = projectF(x, y, z);
        const rx = R * f * sxScale;
        const ry = R * f * scale;
        const dim = -0.32 * (1 - Math.min(1.0, Math.max(0.0, (zt + 0.8) / 1.6)));
        const rot = seed + ang * 0.7;

        for (let row = Math.floor(fy - ry) - 1; row <= Math.floor(fy + ry) + 1; row++) {
          const dy = (row + 0.5 - fy) / ry;
          for (let col = Math.floor(fx - rx) - 1; col <= Math.floor(fx + rx) + 1; col++) {
            const dx = (col + 0.5 - fx) / rx;

            if (kind === "rose") {
              const s = Math.hypot(dx, dy);
              if (s > 1.0) continue;
              const ph = Math.atan2(dy, dx) + rot;
              const spiral = ph + 6.8 * s;
              const wave = Math.cos(2.8 * spiral);
              const outerR = 0.86 + 0.14 * Math.cos(5 * ph + 2.2 * s);
              if (s > outerR) continue;
              const petalFold = 0.5 + 0.5 * wave;
              const crease = petalFold < 0.28 ? -0.32 : 0.18 * petalFold;
              const depthShade = -0.28 * (1.0 - s);
              let b = 0.64 - 0.25 * dx - 0.28 * dy + crease + depthShade + dim;
              b = Math.min(0.999, Math.max(0.0, b));
              const ch = s < 0.11 ? "@" : PETAL_SHADE[Math.floor(b * PETAL_SHADE.length)];
              plot(col, row, zt + 0.08 * (1.0 - s * 0.6), ch, pal[Math.floor(b * pal.length)]);
            } else if (kind === "disc") {
              const s = Math.hypot(dx, dy);
              if (s > 1.0) continue;
              if (s < 0.28) {
                const seedTex = 0.14 * Math.sin(24 * dx) * Math.cos(24 * dy);
                let b = 0.58 - 0.35 * dx - 0.35 * dy + seedTex + dim;
                b = Math.min(0.999, Math.max(0.0, b));
                const ch = s < 0.12 ? "@" : s < 0.20 ? "o" : ":";
                plot(col, row, zt + 0.09, ch, cpal[Math.floor(b * cpal.length)]);
                continue;
              }
              const ph = Math.atan2(dy, dx) + rot;
              const frontReach = 0.28 + 0.72 * Math.pow(Math.abs(Math.cos((nPet * ph) / 2)), 0.65);
              const backReach = 0.26 + 0.66 * Math.pow(Math.abs(Math.cos((nPet * (ph + Math.PI / nPet)) / 2)), 0.65);

              if (s <= frontReach) {
                const rib = 0.12 * Math.cos(nPet * ph);
                const edge = s > frontReach - 0.09 ? -0.22 : 0.0;
                let b = 0.68 - 0.22 * dx - 0.28 * dy + rib + edge + dim;
                b = Math.min(0.999, Math.max(0.0, b));
                plot(col, row, zt + 0.07 * (1 - s), PETAL_SHADE[Math.floor(b * PETAL_SHADE.length)], pal[Math.floor(b * pal.length)]);
              } else if (s <= backReach) {
                let b = 0.45 - 0.20 * dx - 0.25 * dy + dim;
                b = Math.min(0.999, Math.max(0.0, b));
                plot(col, row, zt + 0.045 * (1 - s), PETAL_SHADE[Math.floor(b * PETAL_SHADE.length)], pal[Math.floor(b * pal.length)]);
              }
            } else {
              const v = (1 - dy) / 2;
              if (v < 0 || v > 1) continue;
              const hw = 0.66 * Math.sin(Math.PI * 0.52 * Math.min(1.0, v * 1.45 + 0.06));
              if (hw <= 0 || Math.abs(dx) > hw) continue;
              const xn = dx / hw;
              const crown = 0.72 + 0.28 * Math.pow(Math.cos(1.5 * Math.PI * xn), 2);
              if (v > crown) continue;
              const seam = Math.abs(Math.abs(xn) - 0.34) < 0.08 && v > 0.20 ? -0.34 : 0.0;
              const lobeShine = 0.18 * Math.cos(3.0 * Math.PI * xn);
              let b = 0.58 - 0.26 * xn + 0.16 * v + lobeShine + seam + dim;
              b = Math.min(0.999, Math.max(0.0, b));
              plot(col, row, zt + 0.06, PETAL_SHADE[Math.floor(b * PETAL_SHADE.length)], pal[Math.floor(b * pal.length)]);
            }
          }
        }
      }

      for (const [x, y, z, phase] of babies) {
        const [col, row, zt] = project(x, y, z);
        const star = Math.sin(t * 2 + phase) > 0.65;
        plot(col, row, zt + 0.02, star ? "*" : "·", star ? "#ffffff" : "#eeeeee");
      }

      for (const [x, y, z, phase, speed] of sparkles) {
        const [col, row, zt] = project(x, y, z);
        const tw = Math.sin(t * speed + phase);
        if (tw > 0.85) plot(col, row, zt, "*", "#ffffff");
        else if (tw > 0.4) plot(col, row, zt, "+", "#ffd7ff");
        else if (tw > 0.0) plot(col, row, zt, "·", "#ffafd7");
      }

      const mrow = rows - 2;
      const start = Math.max(0, Math.floor((cols - MESSAGE.length) / 2));
      const shift = Math.floor(t * 6);
      for (let i = 0; i < MESSAGE.length; i++) {
        if (start + i < cols) {
          chars[mrow][start + i] = MESSAGE[i];
          colors[mrow][start + i] = MSG_COLORS[(i + shift) % MSG_COLORS.length];
        }
      }

      let html = "";
      for (let r = 0; r < rows; r++) {
        const rc = chars[r];
        const rcol = colors[r];
        let lastColor = "";
        let spanOpen = false;
        for (let c = 0; c < cols; c++) {
          const ch = rc[c];
          if (ch === " ") {
            if (spanOpen) {
              html += "</span>";
              spanOpen = false;
              lastColor = "";
            }
            html += " ";
          } else {
            const col = rcol[c];
            if (col !== lastColor) {
              if (spanOpen) html += "</span>";
              html += `<span style="color:${col}">`;
              spanOpen = true;
              lastColor = col;
            }
            html += ch === "<" ? "&lt;" : ch === ">" ? "&gt;" : ch === "&" ? "&amp;" : ch;
          }
        }
        if (spanOpen) html += "</span>";
        if (r < rows - 1) html += "\n";
      }
      screenEl.innerHTML = html;
    }

    let last = performance.now();
    const start = last;
    function loop(now) {
      const dt = (now - last) / 1000;
      last = now;
      updateHearts(dt);
      render((now - start) / 1000);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // Control de música de fondo con YouTube
    let player = null;
    let isPlaying = false;
    const musicBtn = document.getElementById("music-btn");

    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player("yt-player", {
        height: "10",
        width: "10",
        videoId: YOUTUBE_VIDEO_ID,
        playerVars: {
          autoplay: 0,
          loop: 1,
          playlist: YOUTUBE_VIDEO_ID,
          controls: 0,
          playsinline: 1,
        },
        events: {
          onStateChange: function (event) {
            if (event.data === YT.PlayerState.PLAYING) {
              isPlaying = true;
              musicBtn.textContent = "⏸ Pausar música";
            } else if (event.data === YT.PlayerState.PAUSED) {
              isPlaying = false;
              musicBtn.textContent = "🎵 Activar música";
            }
          },
          onError: function () {
            musicBtn.textContent = "⚠️ Video bloqueado por YT";
          },
        },
      });
    };

    function toggleMusic(e) {
      if (e) e.stopPropagation();
      if (!player || typeof player.playVideo !== "function") return;
      if (isPlaying) {
        player.pauseVideo();
      } else {
        player.setVolume(75);
        player.playVideo();
      }
    }

    musicBtn.addEventListener("click", toggleMusic);

    document.body.addEventListener(
      "click",
      function () {
        if (!isPlaying && player && typeof player.playVideo === "function") {
          player.setVolume(75);
          player.playVideo();
        }
      },
      { once: true }
    );
  </script>
</body>
</html>
